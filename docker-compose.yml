# Long-running local deployment. Manage with scripts/sbuddy.sh (deploy, status, logs, ...).
# Only the API is published on the LAN; Postgres and Redis listen on 127.0.0.1 only.
# cloudflared publishes the viewer to the internet through Cloudflare Tunnel (docs/CLOUDFLARE_TUNNEL.md).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sbuddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sbuddy_db}
      POSTGRES_USER: ${POSTGRES_USER:-sbuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sbuddy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sbuddy-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  # Sbuddy Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: sbuddy-api:latest
    container_name: sbuddy-api
    restart: unless-stopped
    ports:
      # Published for other devices on the LAN. Set API_BIND_IP in .env to the Mac's LAN IPv4
      # address: 0.0.0.0 also listens on the Mac's public IPv6 address (docs/CLOUDFLARE_TUNNEL.md).
      # The tunnel doesn't use this port; cloudflared reaches api:3000 on the compose network.
      - "${API_BIND_IP:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-sbuddy}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-sbuddy_db}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      # Session
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}

      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # OCR Service
      OCR_SERVICE_URL: ${OCR_SERVICE_URL:-http://ocr:8000}

      # Server
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}

      # File Upload
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}

      # OAuth - Google
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # OAuth - Apple (optional)
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}

      # Email (SMTP)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-noreply@sbuddy.com}

      # Frontend URL
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      API_URL: ${API_URL:-http://localhost:3000}

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging

  # Cloudflare Tunnel: serves the public viewer at https://sbuddy.xuanlin.us (ADR 0001).
  # Ingress rules (which paths are public) live in the tunnel's remote config on Cloudflare,
  # not here. Needs CLOUDFLARE_TUNNEL_TOKEN in .env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sbuddy-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

  # OCR Service (Surya) - Optional, comment out if using external OCR
  # ocr:
  #   image: datalab-to/surya:latest
  #   container_name: sbuddy-ocr
  #   restart: unless-stopped
  #   ports:
  #     - "${OCR_PORT:-8000}:8000"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  default:
    name: sbuddy-network