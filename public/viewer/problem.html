<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem Details - AMC 2012 10A</title>
    <!-- MathJax for LaTeX rendering -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <script src="rounds.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
        }

        .difficulty-badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .difficulty-badge.easy { background: #28a745; color: white; }
        .difficulty-badge.medium { background: #ffc107; color: #333; }
        .difficulty-badge.hard { background: #dc3545; color: white; }

        .content {
            padding: 40px;
        }

        .problem-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-item label {
            font-size: 0.85rem;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .info-item .value {
            font-size: 1.2rem;
            color: #212529;
            font-weight: 600;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            color: #495057;
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .problem-statement {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            font-size: 1.1rem;
            line-height: 1.8;
            color: #212529;
            border-left: 4px solid #667eea;
        }

        .choices {
            background: #fff3cd;
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
        }

        .choices h3 {
            color: #856404;
            margin-bottom: 10px;
        }

        .choice {
            padding: 8px 0;
            font-size: 1rem;
            color: #212529;
        }

        .solutions {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .solution-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s;
        }

        .solution-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .solution-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .solution-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #667eea;
        }

        .toggle-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .toggle-btn:hover {
            background: #5568d3;
        }

        .solution-content {
            line-height: 1.8;
            color: #495057;
            font-size: 1rem;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        /* Line breaks in Problem and solution text are kept (#16). Applied to a
           wrapper holding only the text, so template whitespace isn't shown. */
        .rich-text {
            white-space: pre-line;
            overflow-x: auto; /* a long equation can't wrap; scroll rather than clip */
        }

        .answer-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px 20px;
        }

        .answer-card .solution-header { margin-bottom: 0; }

        .answer-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2d3748;
        }

        .answer-alternatives {
            margin-top: 6px;
            color: #6c757d;
            font-size: 0.95rem;
        }

        .solution-content.expanded {
            max-height: 10000px;
            padding-top: 15px;
            border-top: 1px solid #e9ecef;
        }

        .topics, .see-also {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            background: #e7f3ff;
            color: #004085;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            padding: 30px 40px;
            background: #f8f9fa;
            border-top: 2px solid #e9ecef;
        }

        .nav-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .nav-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .nav-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #6c757d;
            font-size: 1.2rem;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            margin: 20px;
        }

        .images-info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            color: #004085;
            margin-top: 15px;
        }

        /* Study Plan Styles */
        .study-plan-header-btn {
            position: absolute;
            top: 20px;
            right: 40px;
            display: flex;
            gap: 10px;
        }

        .study-plan-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .study-plan-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .add-to-plan-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .add-to-plan-btn:hover {
            background: #218838;
        }

        .add-to-plan-btn.in-plan {
            background: #6c757d;
        }

        .add-to-plan-btn.in-plan:hover {
            background: #5a6268;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .content {
                padding: 20px;
            }

            .problem-info {
                flex-direction: column;
                gap: 15px;
            }
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
                max-width: 100%;
                border-radius: 0;
            }

            .header {
                background: white;
                color: #333;
                border-bottom: 2px solid #333;
                padding: 10px;
                page-break-after: avoid;
            }

            .back-btn,
            .study-plan-btn,
            .add-to-plan-btn,
            .study-plan-header-btn,
            .toggle-btn {
                display: none !important;
            }

            .navigation {
                display: none !important;
            }

            /* Image sizing for A4 paper */
            img {
                max-width: 50% !important;
                max-height: 250px !important;
                height: auto !important;
                object-fit: contain !important;
                page-break-inside: avoid;
                display: block;
                margin: 10px auto;
            }

            /* Specific sizing for answer choices images */
            .problem-statement img,
            div[style*="margin-top: 15px"] img {
                max-width: 42.5% !important;
                max-height: 200px !important;
            }

            /* Diagram images in solutions */
            .solution-content img {
                max-width: 35% !important;
                max-height: 175px !important;
            }

            .problem-card,
            .solution-card,
            .section {
                page-break-inside: avoid;
                border: 1px solid #ccc;
                margin-bottom: 15px;
            }

            .solution-content {
                display: block !important;
                height: auto !important;
            }

            .content {
                padding: 15px;
            }

            /* Ensure text wraps properly around smaller images */
            .problem-statement {
                overflow: visible;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header" style="position: relative;">
            <div class="study-plan-header-btn">
                <a href="studyPlan.html" class="study-plan-btn">📚 Study Plan</a>
                <button class="add-to-plan-btn" id="addToPlanBtn" onclick="toggleStudyPlan()">
                    + Add to Study Plan
                </button>
            </div>
            <div class="header-left">
                <a href="index.html" class="back-btn" id="backBtn">← Back to List</a>
                <h1 id="problemTitle">Loading...</h1>
            </div>
            <div id="difficultyBadge"></div>
        </div>

        <div class="content" id="content">
            <div class="loading">Loading problem...</div>
        </div>

        <div class="navigation" id="navigation" style="display: none;">
            <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">← Previous</button>
            <button class="nav-btn" id="nextBtn" onclick="navigate(1)">Next →</button>
        </div>
    </div>

    <script>
        let currentProblem = null;
        let allProblems = [];
        let currentTestId = null;

        async function loadProblem() {
            const urlParams = new URLSearchParams(window.location.search);
            const problemId = urlParams.get('id');
            const problemNumber = parseInt(urlParams.get('number'));
            const testFile = urlParams.get('test');

            try {
                // New API-based format: ?id=...
                if (problemId) {
                    await loadProblemById(problemId);
                }
                // Old file-based format: ?number=...&test=...
                else if (problemNumber && testFile) {
                    await loadProblemFromFile(problemNumber, testFile);
                }
                else {
                    document.getElementById('content').innerHTML =
                        '<div class="error">No problem specified. Please use ?id=... or ?number=...&test=...</div>';
                }
            } catch (error) {
                document.getElementById('content').innerHTML =
                    '<div class="error">Error loading problem: ' + error.message + '</div>';
            }
        }

        async function loadProblemById(problemId) {
            try {
                // Fetch problem from API
                const response = await fetch(`/api/v1/viewer/problems/${problemId}`);
                if (!response.ok) {
                    throw new Error('Problem not found');
                }
                const result = await response.json();
                currentProblem = result.data;
                currentTestId = currentProblem.testId;

                // Load all problems from the same test for navigation
                const testResponse = await fetch(`/api/v1/viewer/tests/${currentTestId}/problems?limit=1000`);
                if (testResponse.ok) {
                    const testResult = await testResponse.json();
                    allProblems = testResult.data || [];
                }

                // Update page title
                document.getElementById('problemTitle').textContent =
                    `${currentProblem.testName || 'Problem'} - ${Rounds.problemLabel(currentProblem)}`;

                // Update back button to remember the Test and Round
                if (currentTestId) {
                    const round = currentProblem.round ? `&round=${encodeURIComponent(currentProblem.round)}` : '';
                    document.getElementById('backBtn').href = `index.html?testId=${currentTestId}${round}`;
                }

                displayProblem(currentProblem);
                setupNavigationById(problemId);
            } catch (error) {
                throw error;
            }
        }

        async function loadProblemFromFile(problemNumber, testFile) {
            try {
                const response = await fetch(`../../crawled_data/${testFile}`);
                const data = await response.json();
                allProblems = data.problems;

                currentProblem = data.problems.find(p => p.problemNumber === problemNumber);

                if (!currentProblem) {
                    throw new Error('Problem not found');
                }

                // Update page title
                document.getElementById('problemTitle').textContent =
                    `${data.metadata.year} ${data.metadata.test} - Problem ${problemNumber}`;

                displayProblem(currentProblem);
                setupNavigation(problemNumber, testFile);
            } catch (error) {
                throw error;
            }
        }

        function sanitizeCurrency(text) {
            if (!text) return text;
            // Handle $ $X$ pattern (dollar space dollar number dollar) - fix spacing issue
            let result = text.replace(/\$ \$(\d[\d.,]*)\$/g, (match, amount) => `\\$${amount.trim()}`);
            // Handle $$X$ pattern (dollar dollar number dollar)
            result = result.replace(/\$\$(\s*\d[\d.,]*)\$/g, (match, amount) => `\\$${amount.trim()}`);
            return result;
        }

        function formatSolutionWithDiagrams(solution) {
            const sanitized = sanitizeCurrency(solution);
            // Convert [katex]...[/katex] to $...$ for MathJax
            const withLatex = sanitized.replace(/\[katex\](.*?)\[\/katex\]/g, '$$$1$$');
            // Convert [DIAGRAM: URL] markers to actual image tags
            // One line: .rich-text keeps newlines (white-space: pre-line)
            return withLatex.replace(/\[DIAGRAM:\s*([^\]]+)\]/g, (match, url) => {
                return `<div style="margin: 15px 0; text-align: center;"><img src="${url.trim()}" alt="Diagram" style="max-width: 100%; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);" /></div>`;
            });
        }

        function formatChoice(choice) {
            if (!choice) return choice;
            // Handle both string (old format) and object (new API format)
            const choiceText = typeof choice === 'string' ? choice : (choice.choiceText || '');
            if (!choiceText) return '';

            // First apply standard formatting
            let formatted = formatSolutionWithDiagrams(choiceText);
            // If contains LaTeX commands but not wrapped in $...$ or $$...$$, wrap it
            if (/\\[a-zA-Z]+/.test(formatted) && !formatted.includes('$')) {
                formatted = `$${formatted}$`;
            }
            return formatted;
        }

        function displayProblem(problem) {
            document.getElementById('problemTitle').textContent = Rounds.problemLabel(problem);
            document.getElementById('difficultyBadge').innerHTML =
                `<span class="difficulty-badge ${problem.difficulty}">${problem.difficulty}</span>`;

            const choicesHtml = problem.choices && problem.choices.length > 0 ? `
                <div class="choices">
                    <h3>Answer Choices</h3>
                    ${problem.choices.map(choice => `<div class="choice">${formatChoice(choice)}</div>`).join('')}
                </div>
            ` : '';

            const solutionsHtml = problem.solutions && problem.solutions.length > 0 ? `
                <div class="section">
                    <h2>Solutions (${problem.solutions.length} available)</h2>
                    <div class="solutions">
                        ${problem.solutions.map((solution, idx) => {
                            // Handle both string (old format) and object (new API format)
                            const solutionText = typeof solution === 'string' ? solution : (solution.solutionText || '');
                            return `
                            <div class="solution-card">
                                <div class="solution-header" onclick="toggleSolution(${idx})">
                                    <div class="solution-title">Solution ${idx + 1}</div>
                                    <button class="toggle-btn" id="toggleBtn${idx}">Show</button>
                                </div>
                                <div class="solution-content" id="solution${idx}"><div class="rich-text">${formatSolutionWithDiagrams(solutionText)}</div></div>
                            </div>
                        `}).join('')}
                    </div>
                </div>
            ` : '<div class="section"><h2>Solutions</h2><p>No solutions available</p></div>';

            const answerHtml = problem.correctAnswer ? `
                <div class="section">
                    <div class="answer-card">
                        <div class="solution-header" onclick="toggleSolution('Answer')">
                            <div class="solution-title">Answer</div>
                            <button class="toggle-btn" id="toggleBtnAnswer">Show</button>
                        </div>
                        <div class="solution-content" id="solutionAnswer">${Rounds.formatAnswerBlock(problem)}</div>
                    </div>
                </div>
            ` : '';

            // Handle both old format (topics array) and new API format (tags array)
            const topics = problem.topics || (problem.tags ? problem.tags.map(t => t.name) : []);
            const topicsHtml = topics && topics.length > 0 ? `
                <div class="section">
                    <h2>Topics</h2>
                    <div class="topics">
                        ${topics.map(topic => `<span class="tag">${topic}</span>`).join('')}
                    </div>
                </div>
            ` : '';

            const seeAlsoHtml = problem.seeAlso && problem.seeAlso.length > 0 ? `
                <div class="section">
                    <h2>Related Problems</h2>
                    <div class="see-also">
                        ${problem.seeAlso.slice(0, 10).map(item => `<span class="tag">${item}</span>`).join('')}
                    </div>
                </div>
            ` : '';

            // Display answer choices image if available
            const imagesHtml = problem.answerChoicesImage ? `
                <div style="margin-top: 15px;">
                    <img src="${problem.answerChoicesImage}" alt="Answer Choices" style="max-width: 100%; margin: 5px 0; background: white; padding: 5px; border-radius: 4px;" />
                </div>
            ` : '';

            // Extract year and test from testName if not in old format
            const yearMatch = problem.testName ? problem.testName.match(/(\d{4})/) : null;
            const year = problem.year || (yearMatch ? yearMatch[1] : '');
            const testName = problem.test || problem.testName || '';

            const html = `
                <div class="problem-info">
                    <div class="info-item">
                        <label>Year</label>
                        <div class="value">${year}</div>
                    </div>
                    <div class="info-item">
                        <label>Test</label>
                        <div class="value">${testName}</div>
                    </div>
                    <div class="info-item">
                        <label>Problem</label>
                        <div class="value">${problem.round ? Rounds.problemLabel(problem) : problem.problemNumber}</div>
                    </div>
                    <div class="info-item">
                        <label>Difficulty</label>
                        <div class="value">${problem.difficulty || 'N/A'}</div>
                    </div>
                </div>

                <div class="section">
                    <h2>Problem Statement</h2>
                    <div class="problem-statement"><div class="rich-text">${formatSolutionWithDiagrams(problem.content || '')}</div></div>
                    ${choicesHtml}
                    ${imagesHtml}
                </div>

                ${answerHtml}
                ${solutionsHtml}
                ${topicsHtml}
                ${seeAlsoHtml}
            `;

            document.getElementById('content').innerHTML = html;

            // Trigger MathJax rendering after it's loaded
            const renderMath = () => {
                if (window.MathJax && window.MathJax.typesetPromise) {
                    MathJax.typesetPromise().catch((err) => console.log('MathJax error:', err));
                }
            };

            // Wait for MathJax to load if not ready yet
            if (window.MathJax) {
                renderMath();
            } else {
                // Poll for MathJax to be ready
                const checkMathJax = setInterval(() => {
                    if (window.MathJax && window.MathJax.typesetPromise) {
                        clearInterval(checkMathJax);
                        renderMath();
                    }
                }, 100);

                // Stop checking after 5 seconds
                setTimeout(() => clearInterval(checkMathJax), 5000);
            }
        }

        function toggleSolution(idx) {
            const content = document.getElementById(`solution${idx}`);
            const btn = document.getElementById(`toggleBtn${idx}`);

            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                btn.textContent = 'Show';
            } else {
                content.classList.add('expanded');
                btn.textContent = 'Hide';

                // Render MathJax for newly expanded solution
                if (window.MathJax && window.MathJax.typesetPromise) {
                    MathJax.typesetPromise([content]).catch((err) => console.log('MathJax error:', err));
                }
            }
        }

        function setupNavigationById(currentProblemId) {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const nav = document.getElementById('navigation');

            nav.style.display = 'flex';

            const currentIndex = allProblems.findIndex(p => p.id === currentProblemId);
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === allProblems.length - 1;
        }

        function setupNavigation(currentNumber, testFile) {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const nav = document.getElementById('navigation');

            nav.style.display = 'flex';

            const maxProblem = allProblems.length;
            prevBtn.disabled = currentNumber === 1;
            nextBtn.disabled = currentNumber === maxProblem;
        }

        function navigate(direction) {
            const urlParams = new URLSearchParams(window.location.search);
            const problemId = urlParams.get('id');

            // New API-based navigation
            if (problemId) {
                const currentIndex = allProblems.findIndex(p => p.id === problemId);
                const newIndex = currentIndex + direction;

                if (newIndex >= 0 && newIndex < allProblems.length) {
                    window.location.href = `problem.html?id=${allProblems[newIndex].id}`;
                }
            }
            // Old file-based navigation
            else {
                const currentNumber = parseInt(urlParams.get('number'));
                const testFile = urlParams.get('test') || 'amc_2012_10a_problems.json';
                const newNumber = currentNumber + direction;

                const maxProblem = allProblems.length;
                if (newNumber >= 1 && newNumber <= maxProblem) {
                    window.location.href = `problem.html?number=${newNumber}&test=${testFile}`;
                }
            }
        }

        // Load problem on page load
        loadProblem();
    </script>

    <!-- Study Plan Management -->
    <script src="studyPlan.js"></script>
    <script>
        async function updateStudyPlanButton() {
            const urlParams = new URLSearchParams(window.location.search);
            const problemId = urlParams.get('id');
            const problemNumber = parseInt(urlParams.get('number'));
            const testFile = urlParams.get('test');

            const btn = document.getElementById('addToPlanBtn');
            if (!btn) return;

            let inPlan = false;

            // Use API-based method if we have a problem ID
            if (problemId) {
                inPlan = await window.studyPlanManager.isProblemInPlanById(problemId);
            }
            // Fall back to old file-based method
            else if (problemNumber && testFile) {
                inPlan = window.studyPlanManager.isProblemInPlan(problemNumber, testFile);
            }

            btn.className = 'add-to-plan-btn' + (inPlan ? ' in-plan' : '');
            btn.textContent = inPlan ? '✓ In Study Plan' : '+ Add to Study Plan';
        }

        async function toggleStudyPlan() {
            const urlParams = new URLSearchParams(window.location.search);
            const problemId = urlParams.get('id');
            const problemNumber = parseInt(urlParams.get('number'));
            const testFile = urlParams.get('test');

            // Use API-based method if we have a problem ID
            if (problemId) {
                await window.studyPlanManager.toggleProblemById(problemId);
                await updateStudyPlanButton();
            }
            // Fall back to old file-based method
            else if (problemNumber && testFile) {
                window.studyPlanManager.toggleProblem(problemNumber, testFile);
                updateStudyPlanButton();
            }
        }

        // Update button when page loads and problem is loaded
        window.addEventListener('load', () => {
            setTimeout(updateStudyPlanButton, 100);
        });
    </script>
</body>
</html>
