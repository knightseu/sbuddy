<!DOCTYPE html>
<!--
  PROTOTYPE — throwaway. Question (issue #13): how should the viewer present Rounds,
  filter by Round across Tests, and add a whole Round to a study plan, while single-Round
  AMC Tests stay as simple as today?
  Three variants switchable via ?variant=A|B|C (or ← / →). All data is MOCK and in memory:
  MATHCOUNTS problem text is made up (licensing), "add to plan" only edits an in-memory set.
  Open by double-clicking the file; no server needed.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PROTOTYPE — Rounds in the viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px 20px 90px; }
  .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 16px;
               box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden; }
  .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 28px 40px; text-align: center; }
  .header h1 { font-size: 2rem; }
  .header select { margin-top: 14px; padding: 10px; border-radius: 8px; border: 2px solid #fff; font-size: 1rem; min-width: 260px; }
  .body { padding: 24px 40px; }
  h2 { color: #495057; margin: 8px 0 14px; }
  h3 { color: #495057; margin: 18px 0 10px; display: flex; align-items: center; gap: 12px; }
  .btn { padding: 8px 14px; border: 2px solid #667eea; background: white; color: #667eea; border-radius: 8px;
         cursor: pointer; font-weight: 600; font-size: .9rem; }
  .btn.primary { background: #667eea; color: white; }
  .btn.done { background: #28a745; border-color: #28a745; color: white; }
  .btn.sm { padding: 4px 10px; font-size: .8rem; }
  .chip { padding: 6px 14px; border-radius: 20px; border: 2px solid #dee2e6; background: white; cursor: pointer; font-weight: 600; }
  .chip.active { background: #667eea; border-color: #667eea; color: white; }
  .chip:disabled { opacity: .35; cursor: not-allowed; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .card { display: flex; gap: 14px; align-items: center; border: 2px solid #e9ecef; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .num { min-width: 64px; height: 48px; border-radius: 8px; background: linear-gradient(135deg,#667eea,#764ba2); color: white;
         font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: .9rem; text-align: center; }
  .content { flex: 1; color: #495057; }
  .meta { font-size: .8rem; color: #868e96; margin-top: 4px; }
  .tabs { display: flex; border-bottom: 3px solid #e9ecef; margin-bottom: 16px; }
  .tab { padding: 12px 20px; cursor: pointer; font-weight: 600; color: #868e96; border-bottom: 3px solid transparent; margin-bottom: -3px; }
  .tab.active { color: #667eea; border-color: #667eea; }
  .tab small { font-weight: 400; }
  .roundbar { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; }
  .section { border: 2px solid #e9ecef; border-radius: 12px; margin-bottom: 14px; }
  .section > summary { padding: 14px 18px; cursor: pointer; font-weight: 700; color: #495057; display: flex; align-items: center; gap: 12px; }
  .section > div { padding: 0 18px 12px; }
  .jump { position: sticky; top: 0; background: white; padding: 10px 0; z-index: 2; }
  .layout { display: grid; grid-template-columns: 260px 1fr; min-height: 600px; }
  .side { background: #f8f9fa; border-right: 2px solid #e9ecef; padding: 16px; font-size: .9rem; }
  .side .comp { font-weight: 700; color: #495057; margin: 12px 0 6px; }
  .side .test { padding: 4px 6px; cursor: pointer; border-radius: 6px; }
  .side .test.active, .side .rnd.active { background: #667eea; color: white; }
  .side .rnd { padding: 2px 6px 2px 22px; cursor: pointer; border-radius: 6px; color: #6c757d; }
  table.matrix { border-collapse: collapse; width: 100%; margin-bottom: 18px; }
  .matrix th, .matrix td { border: 1px solid #e9ecef; padding: 8px; text-align: center; }
  .matrix th.colhead { cursor: pointer; color: #667eea; }
  .matrix td.cell { cursor: pointer; }
  .matrix td.cell:hover { background: #eef0ff; }
  .matrix td.na { color: #ced4da; }
  .matrix td.inplan { background: #d4edda; }
  .muted { color: #868e96; }
  .state { position: fixed; right: 16px; top: 16px; width: 270px; max-height: 60vh; overflow: auto; background: #212529; color: #e9ecef;
           font: 12px/1.4 ui-monospace, monospace; padding: 12px; border-radius: 10px; opacity: .93; }
  .state b { color: #ffd43b; }
  .switcher { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #111; color: white; border-radius: 30px;
              padding: 8px 10px; display: flex; gap: 10px; align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.5); z-index: 10;
              font: 600 14px -apple-system, sans-serif; }
  .switcher button { background: #333; color: white; border: 0; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 16px; }
  .switcher span { min-width: 260px; text-align: center; }
</style>
</head>
<body>
<div class="container" id="app"></div>
<div class="state" id="state"></div>
<div class="switcher">
  <button onclick="cycle(-1)">←</button><span id="variantLabel"></span><button onclick="cycle(1)">→</button>
</div>

<script>
// ---------- MOCK DATA (made up; shapes follow the #11 / #12 decisions) ----------
const ROUND_ORDER = ['sprint', 'target', 'team', 'countdown'];
const ROUND_NAME = { sprint: 'Sprint', target: 'Target', team: 'Team', countdown: 'Countdown' };
const DIFF = ['easy', 'medium', 'hard'];

function mkTest(id, competition, year, variant, name, rounds) {
  const problems = [];
  for (const [round, n] of Object.entries(rounds)) {
    for (let i = 1; i <= n; i++) {
      problems.push({
        id: `${id}-${round || 'x'}-${i}`, round, problemNumber: i,
        difficulty: DIFF[(i * 7 + year) % 3],
        content: round
          ? `[mock] ${ROUND_NAME[round]} problem ${i} of ${name}: a made-up stand-in for the real text.`
          : `[mock] AMC problem ${i}: a made-up stand-in. $\\textbf{(A)}\\ 1 \\quad \\textbf{(B)}\\ 2 \\ldots$`,
      });
    }
  }
  return { id, competition, year, variant, name, problems };
}

const TESTS = [
  mkTest('amc25a', 'AMC 10', 2025, 'A', '2025 AMC 10A', { null: 25 }),
  mkTest('amc25b', 'AMC 10', 2025, 'B', '2025 AMC 10B', { null: 25 }),
  mkTest('mc25nat', 'MATHCOUNTS', 2025, 'National', 'MATHCOUNTS 2025 National', { sprint: 30, target: 8, team: 10 }),
  mkTest('mc25st', 'MATHCOUNTS', 2025, 'State', 'MATHCOUNTS 2025 State', { sprint: 30, target: 8, team: 10, countdown: 80 }),
  mkTest('mc25ch', 'MATHCOUNTS', 2025, 'Chapter', 'MATHCOUNTS 2025 Chapter', { sprint: 30, target: 8, team: 10, countdown: 80 }),
  mkTest('mc24ch', 'MATHCOUNTS', 2024, 'Chapter', 'MATHCOUNTS 2024 Chapter', { sprint: 30, target: 8, team: 10, countdown: 80 }),
  mkTest('mc21ch', 'MATHCOUNTS', 2021, 'Chapter', 'MATHCOUNTS 2021 Chapter (virtual)', { sprint: 30, target: 8 }),
];
// AMC problems: round = null (single unnamed Round)
TESTS.forEach(t => t.problems.forEach(p => { if (p.round === 'null') p.round = null; }));
const COMPETITIONS = [...new Set(TESTS.map(t => t.competition))];
const isMultiRound = t => t.problems.some(p => p.round);
const roundsOf = t => ROUND_ORDER.filter(r => t.problems.some(p => p.round === r));
const label = p => p.round ? `${ROUND_NAME[p.round]} ${p.problemNumber}` : `${p.problemNumber}`;

// ---------- STUB STUDY PLAN (in memory) ----------
const plan = new Set();
const log = [];
function addMany(problems, what) {
  const before = plan.size; problems.forEach(p => plan.add(p.id));
  log.unshift(`+${plan.size - before} (${what})`); render();
}
function removeMany(problems, what) {
  const before = plan.size; problems.forEach(p => plan.delete(p.id));
  log.unshift(`-${before - plan.size} (${what})`); render();
}
function toggleOne(id) { plan.has(id) ? plan.delete(id) : plan.add(id); log.unshift(`${plan.has(id) ? '+' : '-'}1 (${id})`); render(); }
const allIn = ps => ps.length > 0 && ps.every(p => plan.has(p.id));
function bulkBtn(ps, what, cls = '') {
  const k = 'b' + (bulkBtn.n = (bulkBtn.n || 0) + 1);
  bulkBtn.reg[k] = { ps, what };
  return allIn(ps)
    ? `<button class="btn done ${cls}" onclick="event.stopPropagation();bulkRemove('${k}')">✓ ${what} in plan (remove)</button>`
    : `<button class="btn primary ${cls}" onclick="event.stopPropagation();bulkAdd('${k}')">+ Add ${what} (${ps.filter(p => !plan.has(p.id)).length})</button>`;
}
bulkBtn.reg = {};
function bulkAdd(k) { const { ps, what } = bulkBtn.reg[k]; addMany(ps, what); }
function bulkRemove(k) { const { ps, what } = bulkBtn.reg[k]; removeMany(ps, what); }
function card(p, showTest) {
  const t = TESTS.find(t => t.problems.includes(p));
  return `<div class="card">
    <div class="num">${label(p)}</div>
    <div class="content">${p.content}
      <div class="meta">${showTest ? t.name + ' · ' : ''}${p.difficulty}</div></div>
    <button class="btn ${plan.has(p.id) ? 'done' : ''}" onclick="toggleOne('${p.id}')">${plan.has(p.id) ? '✓ In Study Plan' : '+ Add to Study Plan'}</button>
  </div>`;
}

// ---------- UI STATE ----------
const ui = { comp: 'MATHCOUNTS', testId: 'mc25ch', round: 'sprint', crossRound: null, sideSel: null, yearFrom: 2021, yearTo: 2025, levels: ['Chapter', 'State', 'National'] };
const testsOf = c => TESTS.filter(t => t.competition === c);
const curTest = () => TESTS.find(t => t.id === ui.testId);

function header(extra = '') {
  return `<div class="header"><h1>Problems Viewer</h1>
    <select onchange="ui.comp=this.value; ui.testId=testsOf(this.value)[0].id; ui.round=roundsOf(curTest())[0]||null; render()">
      ${COMPETITIONS.map(c => `<option ${c === ui.comp ? 'selected' : ''}>${c}</option>`).join('')}</select>
    ${extra}</div>`;
}

// ---------- VARIANT A: Round tabs (today's page + a tab bar; "All Tests" = cross-Test) ----------
function VariantA() {
  const tests = testsOf(ui.comp);
  const all = ui.testId === 'ALL';
  const t = all ? null : curTest();
  const sel = `<select onchange="ui.testId=this.value; render()">
      ${ui.comp === 'MATHCOUNTS' ? `<option value="ALL" ${all ? 'selected' : ''}>— All ${ui.comp} Tests —</option>` : ''}
      ${tests.map(x => `<option value="${x.id}" ${x.id === ui.testId ? 'selected' : ''}>${x.name} (${x.problems.length} problems)</option>`).join('')}</select>`;
  let body;
  if (t && !isMultiRound(t)) {
    // AMC: exactly today's page, no tabs
    body = `<h2>Problems</h2>${t.problems.map(p => card(p)).join('')}`;
  } else {
    const avail = all ? ROUND_ORDER : roundsOf(t);
    if (!avail.includes(ui.round)) ui.round = avail[0];
    const count = r => all ? tests.flatMap(x => x.problems).filter(p => p.round === r).length : t.problems.filter(p => p.round === r).length;
    const tabs = `<div class="tabs">${avail.map(r => `<div class="tab ${r === ui.round ? 'active' : ''}" onclick="ui.round='${r}';render()">${ROUND_NAME[r]} <small>(${count(r)})</small></div>`).join('')}</div>`;
    if (all) {
      const groups = tests.filter(x => x.problems.some(p => p.round === ui.round));
      const ps = groups.flatMap(x => x.problems.filter(p => p.round === ui.round));
      body = `${tabs}<div class="roundbar"><span><b>${ROUND_NAME[ui.round]}</b> across ${groups.length} Tests · ${ps.length} problems</span>${bulkBtn(ps, `all ${ROUND_NAME[ui.round]} shown`)}</div>
        ${groups.map(x => { const gp = x.problems.filter(p => p.round === ui.round);
          return `<h3>${x.name} ${bulkBtn(gp, 'this Round', 'sm')}</h3>${gp.slice(0, 3).map(p => card(p)).join('')}<div class="muted">… ${gp.length - 3} more</div>`; }).join('')}`;
    } else {
      const ps = t.problems.filter(p => p.round === ui.round);
      body = `${tabs}<div class="roundbar"><span><b>${ROUND_NAME[ui.round]} Round</b> · ${ps.length} problems</span>${bulkBtn(ps, `whole ${ROUND_NAME[ui.round]} Round`)}</div>${ps.map(p => card(p)).join('')}`;
    }
  }
  return header(sel) + `<div class="body">${body}</div>`;
}
VariantA.title = 'Round tabs';

// ---------- VARIANT B: one long Test page, collapsible Round sections + Round filter chips ----------
function VariantB() {
  const tests = testsOf(ui.comp);
  const t = curTest();
  const sel = `<select onchange="ui.testId=this.value; ui.crossRound=null; render()">
      ${tests.map(x => `<option value="${x.id}" ${x.id === ui.testId ? 'selected' : ''}>${x.name}</option>`).join('')}</select>`;
  const multi = ui.comp === 'MATHCOUNTS';
  // Round filter chips: picking one switches to the cross-Test results view
  const chips = multi ? `<div class="row"><b class="muted">Find a Round across Tests:</b>
      ${ROUND_ORDER.map(r => `<button class="chip ${ui.crossRound === r ? 'active' : ''}" onclick="ui.crossRound=${ui.crossRound === r ? 'null' : `'${r}'`};render()">${ROUND_NAME[r]}</button>`).join('')}
      <span class="muted">years</span>
      <select onchange="ui.yearFrom=+this.value;render()">${[2021,2022,2023,2024,2025].map(y => `<option ${y === ui.yearFrom ? 'selected' : ''}>${y}</option>`).join('')}</select>–
      <select onchange="ui.yearTo=+this.value;render()">${[2021,2022,2023,2024,2025].map(y => `<option ${y === ui.yearTo ? 'selected' : ''}>${y}</option>`).join('')}</select>
      ${['Chapter','State','National'].map(l => `<label><input type="checkbox" ${ui.levels.includes(l) ? 'checked' : ''} onchange="ui.levels=this.checked?[...ui.levels,'${l}']:ui.levels.filter(x=>x!=='${l}');render()"> ${l}</label>`).join('')}
    </div>` : '';
  let body;
  if (multi && ui.crossRound) {
    const groups = tests.filter(x => x.year >= ui.yearFrom && x.year <= ui.yearTo && ui.levels.includes(x.variant) && x.problems.some(p => p.round === ui.crossRound));
    const ps = groups.flatMap(x => x.problems.filter(p => p.round === ui.crossRound));
    body = `<h2>${ROUND_NAME[ui.crossRound]} problems · ${groups.length} Tests · ${ps.length} problems ${bulkBtn(ps, 'all results')}</h2>
      ${groups.map(x => { const gp = x.problems.filter(p => p.round === ui.crossRound);
        return `<details class="section"><summary>${x.name} — ${gp.length} problems ${bulkBtn(gp, 'this Round', 'sm')}</summary><div>${gp.map(p => card(p)).join('')}</div></details>`; }).join('')}`;
  } else if (!isMultiRound(t)) {
    body = `<h2>Problems</h2>${t.problems.map(p => card(p)).join('')}`;
  } else {
    const rs = roundsOf(t);
    body = `<div class="jump row">${rs.map(r => `<a class="chip" href="#sec-${r}">${ROUND_NAME[r]}</a>`).join('')} ${bulkBtn(t.problems, 'whole Test', 'sm')}</div>
      ${rs.map(r => { const ps = t.problems.filter(p => p.round === r);
        return `<details class="section" id="sec-${r}" ${r === 'sprint' ? 'open' : ''}><summary>${ROUND_NAME[r]} Round — ${ps.length} problems ${bulkBtn(ps, `${ROUND_NAME[r]} Round`, 'sm')}</summary><div>${ps.map(p => card(p)).join('')}</div></details>`; }).join('')}`;
  }
  return header(sel) + `<div class="body">${chips}${body}</div>`;
}
VariantB.title = 'Round sections + cross-Test chips';

// ---------- VARIANT C: sidebar tree + Tests × Rounds matrix ----------
function VariantC() {
  const tree = COMPETITIONS.map(c => `<div class="comp">${c}</div>` + testsOf(c).map(t =>
    `<div class="test ${ui.sideSel?.test === t.id && !ui.sideSel?.round ? 'active' : ''}" onclick="ui.sideSel={test:'${t.id}'};render()">${t.name.replace('MATHCOUNTS ', '')}</div>` +
    (isMultiRound(t) ? roundsOf(t).map(r => `<div class="rnd ${ui.sideSel?.test === t.id && ui.sideSel?.round === r ? 'active' : ''}" onclick="ui.sideSel={test:'${t.id}',round:'${r}'};render()">${ROUND_NAME[r]}</div>`).join('') : '')
  ).join('')).join('');
  const mc = testsOf('MATHCOUNTS');
  const matrix = `<h2>MATHCOUNTS — Tests × Rounds</h2><p class="muted" style="margin-bottom:8px">Click a cell to open that Round; click a column header for that Round across all Tests. Green = whole Round in plan.</p>
    <table class="matrix"><tr><th>Test</th>${ROUND_ORDER.map(r => `<th class="colhead" onclick="ui.sideSel={col:'${r}'};render()">${ROUND_NAME[r]} ▸</th>`).join('')}</tr>
    ${mc.map(t => `<tr><td style="text-align:left">${t.name.replace('MATHCOUNTS ', '')}</td>${ROUND_ORDER.map(r => {
      const ps = t.problems.filter(p => p.round === r);
      return ps.length ? `<td class="cell ${allIn(ps) ? 'inplan' : ''}" onclick="ui.sideSel={test:'${t.id}',round:'${r}'};render()">${ps.length} ${bulkBtn(ps, '', 'sm').replace(/\+ Add  \((\d+)\)/, '+').replace(/✓  in plan \(remove\)/, '✓')}</td>` : `<td class="na">—</td>`;
    }).join('')}</tr>`).join('')}</table>`;
  let main = '';
  const s = ui.sideSel;
  if (s?.col) {
    const ps = mc.flatMap(t => t.problems.filter(p => p.round === s.col));
    main = `<h2>${ROUND_NAME[s.col]} across all MATHCOUNTS Tests · ${ps.length} ${bulkBtn(ps, 'all')}</h2>${ps.slice(0, 12).map(p => card(p, true)).join('')}<div class="muted">… ${ps.length - 12} more</div>`;
  } else if (s?.test) {
    const t = TESTS.find(x => x.id === s.test);
    const ps = s.round ? t.problems.filter(p => p.round === s.round) : t.problems;
    main = `<h2>${t.name}${s.round ? ' — ' + ROUND_NAME[s.round] + ' Round' : ''} ${bulkBtn(ps, s.round ? 'this Round' : 'whole Test')}</h2>${ps.map(p => card(p)).join('')}`;
  }
  return `<div class="header"><h1>Problems Viewer</h1></div>
    <div class="layout"><div class="side">${tree}</div><div class="body">${matrix}${main}</div></div>`;
}
VariantC.title = 'Sidebar tree + Tests×Rounds matrix';

// ---------- SWITCHER + STATE ----------
const VARIANTS = { A: VariantA, B: VariantB, C: VariantC };
const keys = Object.keys(VARIANTS);
const cur = () => { const v = new URLSearchParams(location.search).get('variant'); return keys.includes(v) ? v : 'A'; };
function cycle(d) {
  const i = (keys.indexOf(cur()) + d + keys.length) % keys.length;
  const u = new URL(location.href); u.searchParams.set('variant', keys[i]); history.replaceState(null, '', u); render();
}
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1);
});
function render() {
  bulkBtn.reg = {}; bulkBtn.n = 0;
  const v = cur();
  document.getElementById('app').innerHTML = VARIANTS[v]();
  document.getElementById('variantLabel').textContent = `${v} (${VARIANTS[v].title})`;
  const byTest = {};
  for (const id of plan) { const t = TESTS.find(t => t.problems.some(p => p.id === id)); const p = t.problems.find(p => p.id === id);
    const k = t.name + (p.round ? ' / ' + ROUND_NAME[p.round] : ''); byTest[k] = (byTest[k] || 0) + 1; }
  document.getElementById('state').innerHTML = `<b>STATE</b> variant=${v}<br>ui=${JSON.stringify({ comp: ui.comp, testId: ui.testId, round: ui.round, crossRound: ui.crossRound, sideSel: ui.sideSel })}<br><br>
    <b>Study plan: ${plan.size} problems</b><br>${Object.entries(byTest).map(([k, n]) => `${k}: ${n}`).join('<br>') || '(empty)'}<br><br><b>Log</b><br>${log.slice(0, 8).join('<br>')}`;
}
render();
</script>
</body>
</html>
